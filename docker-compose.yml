version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nodejstest_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 29Vlach92@(!@
      POSTGRES_DB: nodejstest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: nodejstest_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nodejstest_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: nodejstest_adminer
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data:
  rabbitmq_data:


networks:
  app-network:
    driver: bridge
