<div class="dashboard-container" style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <mat-card style="max-width: 600px; text-align: center; padding: 40px;">
        <mat-card-header style="justify-content: center; margin-bottom: 20px;">
            <mat-card-title style="font-size: 3rem; font-weight: bold; color: #3f51b5;">Project Manager</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <p style="font-size: 1.2rem; color: #666; margin-bottom: 40px;">
                Manage your projects and tasks efficiently with our complex enterprise solution.
            </p>
        </mat-card-content>
        <mat-card-actions style="justify-content: center;">
            <button mat-raised-button color="primary" routerLink="/projects"
                style="padding: 10px 30px; font-size: 1.1rem;">
                Get Started
            </button>
        </mat-card-actions>
    </mat-card>
</div>
